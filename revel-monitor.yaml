      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt2_voltage), id(batt2_cell1), id(batt2_cell2),
        id(batt2_cell3), id(batt2_cell4), id(batt2_bms_temp),
        id(batt2_batt_temp), id(batt2_current), id(batt2_soc), id(batt2_capacity),
        id(batt2_power), id(batt2_status_code), &id(batt2_last_status), &id(batt2_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  - platform: ble_client
    ble_client_id: battery_3
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    notify: true
    update_interval: never
    internal: true
    id: batt3_ble_raw
    lambda: |-
      std::string &buf = id(batt3_buf);
      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt3_voltage), id(batt3_cell1), id(batt3_cell2),
        id(batt3_cell3), id(batt3_cell4), id(batt3_bms_temp),
        id(batt3_batt_temp), id(batt3_current), id(batt3_soc), id(batt3_capacity),
        id(batt3_power), id(batt3_status_code), &id(batt3_last_status), &id(batt3_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  # Battery 1 (Li3-010622052)
  - platform: template
    name: "Battery 1 Voltage"
    id: batt1_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    icon: "mdi:battery"
    filters:
      - throttle: 60s
