substitutions:
  # Secrets - override via upload.sh
  wifi_primary_ssid: "PLACEHOLDER"
  wifi_primary_password: "PLACEHOLDER"
  wifi_secondary_ssid: "PLACEHOLDER"
  wifi_secondary_password: "PLACEHOLDER"
  mqtt_broker: "PLACEHOLDER"
  mqtt_username: "PLACEHOLDER"
  mqtt_password: "PLACEHOLDER"
  ota_password: "PLACEHOLDER"
  ble_mac_battery_1: "PLACEHOLDER"
  ble_mac_battery_2: "PLACEHOLDER"
  ble_mac_battery_3: "PLACEHOLDER"

esphome:
  name: revel-monitor
  friendly_name: Revel Monitor
  includes:
    - lithionics_ble.h

esp32:
  board: arduino_nano_esp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LOG_COLORS: "n"
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "4"

wifi:
  networks:
    - ssid: ${wifi_primary_ssid}
      password: ${wifi_primary_password}
    - ssid: ${wifi_secondary_ssid}
      password: ${wifi_secondary_password}
  fast_connect: true
  power_save_mode: NONE
  post_connect_roaming: false
  reboot_timeout: 15min
  # Bounce MQTT on (re)connect so a network switch resets the retry backoff
  # and re-resolves the broker immediately (stale DNS clears once TTL expires)
  on_connect:
    - mqtt.disable
    - mqtt.enable

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: ${mqtt_username}
  password: ${mqtt_password}
  discovery: true
  discovery_prefix: homeassistant
  discovery_unique_id_generator: mac
  topic_prefix: revel
  idf_send_async: true
  log_topic: revel/logs
  # No reboot on MQTT loss: a reboot blips REL3 and power-cycles Starlink, and
  # hive being unreachable while on AC-917 is expected (use P5 restart if wedged)
  reboot_timeout: 0s
  on_connect:
    - logger.log: "MQTT Connected!"
    - switch.turn_off: mqtt_status_light
  on_disconnect:
    - logger.log: "MQTT Disconnected!"
    - switch.turn_on: mqtt_status_light

ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

# BLE for Lithionics battery monitoring
# Service: 0000ffe0 (HM-10 UART), Characteristic: 0000ffe1 (notify)
# MAC addresses derived from BLE scan — update if connections fail
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 100ms

ble_client:
  - mac_address: ${ble_mac_battery_1}
    id: battery_1
  - mac_address: ${ble_mac_battery_2}
    id: battery_2
  - mac_address: ${ble_mac_battery_3}
    id: battery_3

# State tracking
globals:
  - id: batt1_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt2_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt3_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt1_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt2_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt3_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt1_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: batt2_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: batt3_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Starlink auto-on tracking
  - id: wifi_down_mins
    type: int
    restore_value: no
    initial_value: '0'
  # Last network we successfully connected to: 0 = none since flash,
  # 1 = farmland (home), 2 = other (AC-917/Starlink). Persisted to flash so
  # the 15-min no-WiFi reboot doesn't forget a deliberate Starlink-off while away.
  - id: last_wifi_net
    type: int
    restore_value: yes
    initial_value: '0'

# Starlink auto-on: if we lose all WiFi for 5 minutes and the last network we
# had was farmland (i.e. we drove away from home) or none at all, turn REL3 on
# so Starlink/AC-917 comes up. Deliberately NOT triggered when the last network
# was AC-917 — that means Starlink was intentionally shut off while away, and
# auto-on would just undo it in a loop. Fires once per outage (== 5 check).
interval:
  - interval: 60s
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w->is_connected()) {
            id(wifi_down_mins) = 0;
            id(last_wifi_net) = (w->wifi_ssid() == "${wifi_secondary_ssid}") ? 1 : 2;
            return;
          }
          id(wifi_down_mins) += 1;
          if (id(wifi_down_mins) == 5 && !id(starlink_power).state && id(last_wifi_net) != 2) {
            ESP_LOGI("starlink", "No WiFi for 5 min, last network was home/none - auto-enabling Starlink");
            id(starlink_power).turn_on();
          }

# 1-Wire bus for DS18B20 temperature sensor
# Wiring: SDA/A4 terminal (data), 5V (VCC), GND
# Canaduino SDA/A4 -> A4 on Nano ESP32 -> GPIO 11
# IMPORTANT: 4.7kΩ pull-up resistor required between Data and VCC
one_wire:
  - platform: gpio
    pin: 11  # Canaduino SDA/A4 = GPIO 11

# Relay outputs
# Arduino Nano ESP32: D2=GPIO5 (REL1), D4=GPIO7 (REL3), A3=GPIO4 (REL6)
switch:
  # REL6 = indicator light: ON whenever MQTT is disconnected (starts ON at
  # boot, turned off by mqtt on_connect). If the light is on, MQTT is bad.
  - platform: gpio
    pin: 4
    name: "MQTT Status Light"
    id: mqtt_status_light
    icon: "mdi:alarm-light"
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin: 5
    name: "Revel Fan"
    id: revel_fan
    icon: "mdi:fan"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: 7
    name: "Starlink Power"
    id: starlink_power
    icon: "mdi:satellite-uplink"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: ble_client
    ble_client_id: battery_1
    name: "Battery 1 BLE"
    icon: "mdi:bluetooth-connect"
  - platform: ble_client
    ble_client_id: battery_2
    name: "Battery 2 BLE"
    icon: "mdi:bluetooth-connect"
  - platform: ble_client
    ble_client_id: battery_3
    name: "Battery 3 BLE"
    icon: "mdi:bluetooth-connect"

# Physical inputs
# Arduino Nano ESP32: D12=GPIO47 (DI3)
# PLC opto fed 12V from RF box REM output (inputs rated to 24V) - INPUT_PULLDOWN, active HIGH
# DI3 = RF remote relay (QIACHIP 433MHz, latching mode): rising edge turns
# Starlink relay ON, falling edge turns it OFF. HA can still override while
# DI3 is held ON; a new rising edge is required to turn it back on via RF.
binary_sensor:
  - platform: gpio
    pin:
      number: 47
      mode: INPUT_PULLDOWN
    name: "DI3 RF Remote"
    id: di3_rf_remote
    icon: "mdi:remote"
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      - switch.turn_on: starlink_power
    on_release:
      - switch.turn_off: starlink_power

# MQTT buttons for Home Assistant
button:
  - platform: template
    name: "P5 Button - Restart"
    id: btn_restart
    icon: "mdi:restart"
    on_press:
      - logger.log: "Restart requested via P5"
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

# Sensors
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    icon: "mdi:wifi"

  # Voltage sensor on Canaduino A1 (A0 analog input, 0-10V range)
  # A0 on Nano ESP32 -> GPIO 1
  # DC 0-25V sensor module with Canaduino built-in divider
  - platform: adc
    pin: 1
    name: "Revel Voltage"
    id: revel_voltage
    attenuation: auto
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: "mdi:flash"
    filters:
      - calibrate_linear:
          - 0.072 -> 0.0
          - 0.420 -> 5.03
          - 0.892 -> 9.98
          - 1.123 -> 12.26
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2

  - platform: dallas_temp
    name: "Revel Temperature"
    id: revel_temp
    index: 0
    update_interval: 60s
    icon: "mdi:thermometer"
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;
    unit_of_measurement: "°F"

  # --- Lithionics Battery BLE Sensors ---
  # BLE notification receivers (internal — feed parsed data to template sensors)
  - platform: ble_client
    ble_client_id: battery_1
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    notify: true
    update_interval: never
    internal: true
    id: batt1_ble_raw
    lambda: |-
      std::string &buf = id(batt1_buf);
      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt1_voltage), id(batt1_cell1), id(batt1_cell2),
        id(batt1_cell3), id(batt1_cell4), id(batt1_bms_temp),
        id(batt1_batt_temp), id(batt1_current), id(batt1_soc), id(batt1_capacity),
        id(batt1_power), id(batt1_status_code), &id(batt1_last_status), &id(batt1_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  - platform: ble_client
    ble_client_id: battery_2
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
