# Lithionics Battery Dashboard Card for Home Assistant
# Requires: custom:button-card (install via HACS)
#
# Replicates the Li3 Battery app UI with:
# - Battery icon with fill level and SOC color
# - Voltage, Current, Power row
# - Battery Temp, BMS Temp, State row
# - Time Remaining, Status Code row
#
# Copy this into your HA dashboard YAML editor.
# Duplicate and change "_1" to "_2" / "_3" for other batteries.

type: custom:button-card
entity: sensor.revel_monitor_battery_3_soc
show_name: false
show_icon: false
show_state: false
styles:
  card:
    - background: "linear-gradient(145deg, #2a2a2a, #1a1a1a)"
    - border-radius: 12px
    - padding: 16px
    - box-shadow: "0 2px 8px rgba(0,0,0,0.3)"
  grid:
    - grid-template-areas: '"title" "battery" "row1" "row2" "row3"'
    - grid-template-rows: auto auto auto auto auto
custom_fields:
  title: |
    [[[
      return `<div style="color:#ccc;font-size:14px;text-align:center;margin-bottom:4px;">
        Battery 3 <span style="color:#666;font-size:11px;">Li3-032124086</span>
      </div>`;
    ]]]
  battery: |
    [[[
      const soc = parseInt(entity.state) || 0;
      const color = soc >= 40 ? '#4CAF50' : soc >= 20 ? '#FF9800' : '#F44336';
      const fillWidth = Math.max(0, Math.min(100, soc));
      return `
        <div style="display:flex;justify-content:center;align-items:center;padding:12px 0 16px;">
          <div style="position:relative;width:200px;height:80px;">
            <div style="position:absolute;inset:0;border:3px solid #555;border-radius:10px;"></div>
            <div style="position:absolute;top:50%;right:-14px;transform:translateY(-50%);width:10px;height:32px;background:#555;border-radius:0 5px 5px 0;"></div>
            <div style="position:absolute;left:4px;bottom:4px;top:4px;width:calc(${fillWidth}% - 8px);background:${color};border-radius:6px;transition:width 1s ease,background 1s ease;"></div>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:white;text-shadow:0 1px 3px rgba(0,0,0,0.5);">${soc}%</div>
          </div>
        </div>
      `;
    ]]]
  row1: |
    [[[
      const voltage = states['sensor.revel_monitor_battery_3_voltage'] ? states['sensor.revel_monitor_battery_3_voltage'].state : '--';
      const currentVal = states['sensor.revel_monitor_battery_3_current'] ? parseFloat(states['sensor.revel_monitor_battery_3_current'].state) : 0;
      const power = states['sensor.revel_monitor_battery_3_power'] ? parseFloat(states['sensor.revel_monitor_battery_3_power'].state) : 0;
      const currentStr = currentVal > 0 ? `+${currentVal}A` : currentVal < 0 ? `${currentVal}A` : '0A';
      const currentColor = currentVal > 0 ? '#4CAF50' : currentVal < 0 ? '#F44336' : '#999';
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:8px 0;border-top:1px solid #333;">
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Voltage</div>
            <div style="color:#4CAF50;font-size:18px;font-weight:bold;">${voltage}V</div>
          </div>
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Current</div>
            <div style="color:${currentColor};font-size:18px;font-weight:bold;">${currentStr}</div>
          </div>
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Power</div>
            <div style="color:${currentColor};font-size:18px;font-weight:bold;">${Math.abs(power).toFixed(1)}W</div>
          </div>
        </div>
      `;
    ]]]
  row2: |
    [[[
      const battTemp = states['sensor.revel_monitor_battery_3_temperature'] ? parseFloat(states['sensor.revel_monitor_battery_3_temperature'].state) : 0;
      const bmsTemp = states['sensor.revel_monitor_battery_3_bms_temp'] ? parseFloat(states['sensor.revel_monitor_battery_3_bms_temp'].state) : 0;
      const statusCode = states['sensor.revel_monitor_battery_3_status_code'] ? states['sensor.revel_monitor_battery_3_status_code'].state : 'unknown';
      const state = statusCode === '000000' ? 'ON' : statusCode === 'unknown' || statusCode === 'unavailable' ? 'OFF' : 'FAULT';
      const stateColor = state === 'ON' ? '#4CAF50' : state === 'FAULT' ? '#F44336' : '#999';
      const dotColor = state === 'ON' ? '#4CAF50' : state === 'FAULT' ? '#F44336' : '#666';

      function tempColor(t) {
        if (t <= 0) return '#2196F3';
        if (t < 40) return '#42A5F5';
        if (t <= 85) return '#FF9800';
        if (t <= 100) return '#FF5722';
        return '#F44336';
      }

      return `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:8px 0;border-top:1px solid #333;">
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Battery</div>
            <div style="color:${tempColor(battTemp)};font-size:18px;font-weight:bold;">${battTemp}F</div>
          </div>
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">BMS Temp</div>
            <div style="color:${tempColor(bmsTemp)};font-size:18px;font-weight:bold;">${bmsTemp}F</div>
          </div>
          <div>
          <div style="color:#888;font-size:11px;margin-bottom:2px;line-height:11px;">State <span style="color:${dotColor};font-size:16px;">&#x25CF;</span></div>
            <div style="color:${stateColor};font-size:18px;font-weight:bold;">${state}</div>
          </div>
        </div>
      `;
    ]]]
  row3: |
    [[[
      const currentVal = states['sensor.revel_monitor_battery_3_current'] ? parseFloat(states['sensor.revel_monitor_battery_3_current'].state) : 0;
      const capacity = states['sensor.revel_monitor_battery_3_capacity'] ? parseFloat(states['sensor.revel_monitor_battery_3_capacity'].state) : 0;
      const statusCode = states['sensor.revel_monitor_battery_3_status_code'] ? states['sensor.revel_monitor_battery_3_status_code'].state : '000000';

      let timeStr = 'Idle';
      let timeColor = '#999';
      if (currentVal < 0 && capacity > 0) {
        const secs = Math.round(capacity / Math.abs(currentVal) * 3600);
        const d = Math.floor(secs / 86400);
        const h = Math.floor((secs % 86400) / 3600);
        const m = Math.floor((secs % 3600) / 60);
        timeStr = d > 0 ? `${d}d ${h}h` : `${h}h ${m}m`;
        timeColor = '#F44336';
      } else if (currentVal > 0) {
        const fullAh = 130;
        const remaining = Math.max(0, fullAh - capacity);
        if (remaining > 0) {
          const secs = Math.round(remaining / currentVal * 3600);
          const h = Math.floor(secs / 3600);
          const m = Math.floor((secs % 3600) / 60);
          timeStr = `${h}h ${m}m`;
        } else {
          timeStr = 'Full';
        }
        timeColor = '#4CAF50';
      }

      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;text-align:center;padding:8px 0;border-top:1px solid #333;">
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Time Remaining</div>
            <div style="color:${timeColor};font-size:18px;font-weight:bold;">${timeStr}</div>
          </div>
          <div>
            <div style="color:#888;font-size:11px;margin-bottom:2px;">Status Code</div>
            <div style="color:#4CAF50;font-size:18px;font-weight:bold;">${statusCode}</div>
          </div>
        </div>
      `;
    ]]]
