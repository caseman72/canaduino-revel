ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

# BLE for Lithionics battery monitoring
# Service: 0000ffe0 (HM-10 UART), Characteristic: 0000ffe1 (notify)
# MAC addresses derived from BLE scan — update if connections fail
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 100ms

ble_client:
  - mac_address: ${ble_mac_battery_1}
    id: battery_1
  - mac_address: ${ble_mac_battery_2}
    id: battery_2
  - mac_address: ${ble_mac_battery_3}
    id: battery_3

# State tracking
globals:
  - id: use_secondary_network
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: batt1_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt2_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt3_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt1_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt2_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt3_last_status
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: batt1_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: batt2_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: batt3_last_status_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# 1-Wire bus for DS18B20 temperature sensor
# Wiring: SDA/A4 terminal (data), 5V (VCC), GND
# Canaduino SDA/A4 -> A4 on Nano ESP32 -> GPIO 11
# IMPORTANT: 4.7kΩ pull-up resistor required between Data and VCC
one_wire:
  - platform: gpio
    pin: 11  # Canaduino SDA/A4 = GPIO 11

# Relay outputs
# Arduino Nano ESP32: D2=GPIO5
switch:
  - platform: gpio
    pin: 5
    name: "Revel Fan"
    id: revel_fan
    icon: "mdi:fan"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: ble_client
    ble_client_id: battery_1
    name: "Battery 1 BLE"
    icon: "mdi:bluetooth-connect"
  - platform: ble_client
    ble_client_id: battery_2
    name: "Battery 2 BLE"
    icon: "mdi:bluetooth-connect"
  - platform: ble_client
    ble_client_id: battery_3
    name: "Battery 3 BLE"
    icon: "mdi:bluetooth-connect"

# MQTT buttons for Home Assistant
button:
  - platform: template
    name: "P3 Button - Switch Network"
    id: btn_switch_network
    icon: "mdi:wifi-sync"
    on_press:
      - script.execute: switch_network

  - platform: template
    name: "P5 Button - Restart"
    id: btn_restart
    icon: "mdi:restart"
    on_press:
      - logger.log: "Restart requested via P5"
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

# Sensors
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    icon: "mdi:wifi"

  # Voltage sensor on Canaduino A1 (A0 analog input, 0-10V range)
  # A0 on Nano ESP32 -> GPIO 1
  # DC 0-25V sensor module with Canaduino built-in divider
  - platform: adc
    pin: 1
    name: "Revel Voltage"
    id: revel_voltage
    attenuation: auto
    update_interval: 30s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: "mdi:flash"
    filters:
      - calibrate_linear:
          - 0.072 -> 0.0
          - 0.420 -> 5.03
          - 0.892 -> 9.98
          - 1.123 -> 12.26
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2

  - platform: dallas_temp
    name: "Revel Temperature"
    id: revel_temp
    index: 0
    update_interval: 60s
    icon: "mdi:thermometer"
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;
    unit_of_measurement: "°F"

  # --- Lithionics Battery BLE Sensors ---
  # BLE notification receivers (internal — feed parsed data to template sensors)
  - platform: ble_client
    ble_client_id: battery_1
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    notify: true
    update_interval: never
    internal: true
    id: batt1_ble_raw
    lambda: |-
      std::string &buf = id(batt1_buf);
      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt1_voltage), id(batt1_cell1), id(batt1_cell2),
        id(batt1_cell3), id(batt1_cell4), id(batt1_bms_temp),
        id(batt1_batt_temp), id(batt1_current), id(batt1_soc), id(batt1_capacity),
        id(batt1_power), id(batt1_status_code), &id(batt1_last_status), &id(batt1_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  - platform: ble_client
    ble_client_id: battery_2
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    notify: true
    update_interval: never
    internal: true
    id: batt2_ble_raw
    lambda: |-
      std::string &buf = id(batt2_buf);
      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt2_voltage), id(batt2_cell1), id(batt2_cell2),
        id(batt2_cell3), id(batt2_cell4), id(batt2_bms_temp),
        id(batt2_batt_temp), id(batt2_current), id(batt2_soc), id(batt2_capacity),
        id(batt2_power), id(batt2_status_code), &id(batt2_last_status), &id(batt2_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  - platform: ble_client
    ble_client_id: battery_3
    type: characteristic
    service_uuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    characteristic_uuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    notify: true
    update_interval: never
    internal: true
    id: batt3_ble_raw
    lambda: |-
      std::string &buf = id(batt3_buf);
      buf.append(x.begin(), x.end());
      LithionicsSensors s = {id(batt3_voltage), id(batt3_cell1), id(batt3_cell2),
        id(batt3_cell3), id(batt3_cell4), id(batt3_bms_temp),
        id(batt3_batt_temp), id(batt3_current), id(batt3_soc), id(batt3_capacity),
        id(batt3_power), id(batt3_status_code), &id(batt3_last_status), &id(batt3_last_status_ms)};
      lithionics_parse(buf, s);
      return 0;

  # Battery 1 (Li3-010622052)
  - platform: template
    name: "Battery 1 Voltage"
    id: batt1_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    icon: "mdi:battery"
    filters:
      - throttle: 30s
  - platform: template
    name: "Battery 1 Cell 1"
    id: batt1_cell1
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    icon: "mdi:battery-outline"
    filters:
      - throttle: 60s
  - platform: template
