text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      icon: "mdi:ip-network"

  - platform: wifi_info
    ssid:
      name: "WiFi Network"
      id: wifi_network
      icon: "mdi:wifi-cog"

  - platform: template
    name: "Battery 1 Status Code"
    id: batt1_status_code
    icon: "mdi:alert-circle-outline"
  - platform: template
    name: "Battery 2 Status Code"
    id: batt2_status_code
    icon: "mdi:alert-circle-outline"
  - platform: template
    name: "Battery 3 Status Code"
    id: batt3_status_code
    icon: "mdi:alert-circle-outline"

# Scripts
script:
  - id: switch_network
    then:
      - lambda: |-
          id(use_secondary_network) = !id(use_secondary_network);
          if (id(use_secondary_network)) {
            ESP_LOGI("wifi", "Switching to ${wifi_secondary_ssid} - will restart");
          } else {
            ESP_LOGI("wifi", "Switching to ${wifi_primary_ssid} - will restart");
          }
      - delay: 500ms
      - lambda: 'App.safe_reboot();'
